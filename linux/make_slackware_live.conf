# Snakey Linux liveslak configuration.
# liveslak supplies Slackware's boot/runtime machinery; Snakey supplies
# the custom package sequence, release identity and rootcopy customization.
DISTRO="snakey"
LIVEDE="SNAKEY"
SEQ_CUSTOM="min,xbase,xapbase,xfcebase local:snakey-base local:snakey-theme"
SL_VERSION="15.0"
SL_ARCH="x86_64"
LIVE_HOSTNAME="snakey"
LIVEUID="snakey"
RUNLEVEL=4
SL_REPO="/var/cache/snakey/slackware"
OUTPUT="/tmp"
MEDIALABEL="SNAKEY"
MARKER="SNAKEYLIVE"
LIVEMAIN="snakey"
BUILDER="AtDev / Snakey Linux"
