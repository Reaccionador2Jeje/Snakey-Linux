# Snakey Linux liveslak configuration.
# Keep the distro on the stable Slackware 15.0 branch, never implicit current.
DISTRO="snakey"
SL_VERSION="15.0"
SL_ARCH="x86_64"
LIVEDE="XFCE"
LIVE_HOSTNAME="snakey"
RUNLEVEL=4
SL_REPO="/var/cache/snakey/slackware"
SL_REPO_URL="rsync.osuosl.org::slackware"
OUTPUT="/tmp"
MEDIALABEL="SNAKEY"
BUILDER="AtDev / Snakey Linux"
