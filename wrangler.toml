name = "snakey-linux"
main = "worker/index.js"
compatibility_date = "2026-11-25"
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true