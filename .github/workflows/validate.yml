name: Validate Snakey

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate targets and SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install NES toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 rgbds
      - name: Validate target registries
        run: |
          python3 tools/validate_targets.py
          python3 tools/validate_desktop_editions.py
          python3 tools/validate_desktop_core.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path("desktop/nes/main.s").read_text()
          glyphs = source.split('.segment "CHARS"', 1)[1].split('; 16x16 Snakey emblem tiles.', 1)[0]
          assert glyphs.count(".byte") == 25, "Expected 25 character glyphs"
          assert glyphs.count(".res 8, $00 ; second CHR bitplane (transparent)") == 25, "Every 8x8 glyph must occupy a complete 16-byte CHR tile"
          assert "FooterLabel:" in source
          assert "PaletteOne:" in source
          print("NES Desktop CHR tile alignment and shared chrome: OK")
          PY
          python3 tools/validate_linux_targets.py
          python3 tools/validate_linux_sources.py
          python3 tools/validate_ps3_profile.py
      - name: Run SDK tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile tools/native_roms.py tools/snakey.py
      - name: Validate Snakey Linux desktop profile
        run: |
          bash -n linux/build-live.sh
          bash -n linux/packages/build-snakey-base.sh
          bash -n linux/packages/build-snakey-theme.sh
          bash -n linux/packages/build-snakey-control-center.sh
          bash -n linux/packages/build-snakey-browser.sh
          sh -n linux/packages/snakey-base/usr/bin/snakey-info
          sh -n linux/packages/snakey-base/install/doinst.sh
          bash -n linux/rootcopy/usr/bin/snakey-console-mode
          bash -n linux/rootcopy/usr/bin/snakey-console-session
          bash -n linux/rootcopy/usr/bin/snakey-open-keyboard
          python3 -m unittest discover -s linux/tests -v
          python3 -m py_compile linux/rootcopy/usr/bin/snakey-big-picture
          python3 -m py_compile linux/rootcopy/usr/bin/snakey-gamepad linux/rootcopy/usr/bin/snakey-controller-center
          python3 -m py_compile linux/packages/snakey-control-center/usr/bin/snakey-control-center
          python3 -m py_compile linux/packages/snakey-browser/usr/bin/snakey-browser
          python3 -m json.tool linux/profile.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          profile = json.loads(Path("linux/profile.json").read_text())
          assert profile["base"] == "Slackware"
          assert profile["live_variant"] == "SNAKEY"
          assert profile["custom_package"] == "snakey-base"
          assert profile["custom_packages"] == ["snakey-base", "snakey-theme", "snakey-control-center", "snakey-browser"]
          assert profile["custom_package_sequence"] == "min,xbase,xapbase,xfcebase local:snakey-base local:snakey-theme local:snakey-control-center local:snakey-browser"
          assert profile["live_user"] == "snakey"
          assert profile["base_release"] == "15.0"
          assert profile["base_channel"] == "stable"
          assert profile["package_manager"] == "pkgtools"
          assert profile["init_system"] == "SysVinit"
          assert profile["slackware_repository"] == "slackware64-15.0"
          assert profile["builder"] == "liveslak"
          assert profile["architecture"] == "x86_64"
          assert profile["desktop"] == "XFCE"
          assert profile["runlevel"] == 4
          assert profile["trim"] == "bloat"
          for path in (
              "linux/rootcopy/etc/os-release",
              "linux/rootcopy/etc/issue",
              "linux/rootcopy/etc/motd",
              "linux/rootcopy/usr/share/backgrounds/snakey/snakey.svg",
              "linux/rootcopy/etc/xdg/autostart/snakey-gamepad.desktop",
              "linux/rootcopy/usr/share/applications/snakey-virtual-keyboard.desktop",
              "linux/rootcopy/usr/share/applications/snakey-controller-center.desktop",
              "linux/rootcopy/usr/bin/snakey-controller-center",
              "linux/rootcopy/etc/xdg/autostart/snakey-console-mode.desktop",
              "linux/rootcopy/usr/bin/snakey-console-mode",
              "linux/rootcopy/usr/bin/snakey-open-keyboard",
              "linux/rootcopy/usr/bin/snakey-big-picture",
              "linux/rootcopy/usr/bin/snakey-console-session",
              "linux/rootcopy/etc/xdg/autostart/snakey-big-picture.desktop",
              "linux/rootcopy/usr/share/applications/snakey-console-session.desktop",
              "linux/rootcopy/usr/share/applications/snakey-big-picture.desktop",
          ):
              assert Path(path).is_file(), path
          liveslak = Path("linux/make_slackware_live.conf").read_text()
          for setting in ('SL_VERSION="15.0"', 'SL_ARCH="x86_64"', 'LIVEDE="SNAKEY"', 'SEQ_CUSTOM="min,xbase,xapbase,xfcebase local:snakey-base local:snakey-theme local:snakey-control-center local:snakey-browser"', 'RUNLEVEL=4', 'DISTRO="snakey"'):
              assert setting in liveslak, setting
          for path in ("linux/packages/build-snakey-base.sh", "linux/packages/snakey-base/etc/snakey-release", "linux/packages/snakey-base/usr/bin/snakey-info", "linux/packages/snakey-base/install/doinst.sh", "linux/packages/snakey-base/slack-desc", "linux/packages/build-snakey-theme.sh", "linux/packages/snakey-theme/slack-desc", "linux/packages/snakey-theme/usr/share/themes/Snakey-Dark/index.theme", "linux/packages/snakey-theme/usr/share/themes/Snakey-Dark/gtk-3.0/gtk.css", "linux/packages/snakey-theme/usr/share/themes/Snakey-Dark/gtk-2.0/gtkrc", "linux/packages/build-snakey-control-center.sh", "linux/packages/snakey-control-center/slack-desc", "linux/packages/snakey-control-center/usr/bin/snakey-control-center", "linux/packages/snakey-control-center/usr/share/applications/snakey-control-center.desktop", "linux/packages/snakey-control-center/etc/skel/Desktop/Snakey-Control-Center.desktop"):
              assert Path(path).is_file(), path
          builder = Path("linux/build-live.sh").read_text()
          assert "-d SNAKEY" in builder
          assert "-z 15.0" in builder
          assert "local64/snakey-base" in builder
          assert "local64/snakey-theme" in builder
          assert "build-snakey-theme.sh" in builder
          assert "build-snakey-control-center.sh" in builder
          assert "local64/snakey-control-center" in builder
          assert "build-snakey-browser.sh" in builder
          assert "local64/snakey-browser" in builder
          print("Snakey Linux Slackware 15.0 desktop, Control Center and package assets: OK")
          PY
      - name: Build and verify a real NROM-256 ROM
        run: |
          python3 tools/snakey.py new "$RUNNER_TEMP/snakey-nes-smoke" --target nes --name SnakeySmoke
          python3 tools/snakey.py validate "$RUNNER_TEMP/snakey-nes-smoke"
          python3 tools/snakey.py build "$RUNNER_TEMP/snakey-nes-smoke"
          python3 - "$RUNNER_TEMP/snakey-nes-smoke/build/SnakeySmoke.nes" <<'PY'
          import sys
          from pathlib import Path
          rom = Path(sys.argv[1]).read_bytes()
          assert len(rom) == 40976, len(rom)
          assert rom[:4] == b"NES\x1a"
          assert rom[4] == 2 and rom[5] == 1
          chr_data = rom[16 + 0x8000:]
          assert len(chr_data) == 0x2000
          for tile_id in range(1, 26):
              tile = chr_data[tile_id * 16:(tile_id + 1) * 16]
              assert tile[:8] != bytes(8), f"glyph tile {tile_id} is blank"
              assert tile[8:] == bytes(8), f"glyph tile {tile_id} second bitplane is not transparent"
          print("NES iNES header, 32 KiB PRG and 8 KiB CHR: OK")
          PY
      - name: Build Game Boy and Game Boy Color ROMs
        run: |
          python3 tools/snakey.py new "$RUNNER_TEMP/snakey-gb-smoke" --target game-boy --name SnakeyGB
          python3 tools/snakey.py validate "$RUNNER_TEMP/snakey-gb-smoke"
          python3 tools/snakey.py build "$RUNNER_TEMP/snakey-gb-smoke"
          test -s "$RUNNER_TEMP/snakey-gb-smoke/build/SnakeyGB.gb"
          python3 tools/snakey.py new "$RUNNER_TEMP/snakey-gbc-smoke" --target game-boy-color --name SnakeyGBC
          python3 tools/snakey.py validate "$RUNNER_TEMP/snakey-gbc-smoke"
          python3 tools/snakey.py build "$RUNNER_TEMP/snakey-gbc-smoke"
          test -s "$RUNNER_TEMP/snakey-gbc-smoke/build/SnakeyGBC.gbc"
      - name: Build SNES, GBA and Nintendo DS experimental ROMs
        run: |
          for target in snes game-boy-advance nintendo-ds; do
            project="$RUNNER_TEMP/snakey-$target"
            python3 tools/snakey.py new "$project" --target "$target" --name "Snakey"
            python3 tools/snakey.py validate "$project"
            python3 tools/snakey.py build "$project"
          done
          test "$(stat -c %s "$RUNNER_TEMP/snakey-snes/build/Snakey.sfc")" -eq 32768
          test "$(stat -c %s "$RUNNER_TEMP/snakey-game-boy-advance/build/Snakey.gba")" -eq 32768
          test "$(stat -c %s "$RUNNER_TEMP/snakey-nintendo-ds/build/Snakey.nds")" -eq 65536
      - name: Upload experimental console ROMs
        uses: actions/upload-artifact@v4
        with:
          name: snakey-snes-gba-nds-preview
          path: |
            ${{ runner.temp }}/snakey-snes/build/Snakey.sfc
            ${{ runner.temp }}/snakey-game-boy-advance/build/Snakey.gba
            ${{ runner.temp }}/snakey-nintendo-ds/build/Snakey.nds
          if-no-files-found: error
          retention-days: 7
      - name: Upload generated NES ROM
        uses: actions/upload-artifact@v4
        with:
          name: snakey-nes-nrom256-smoke-rom
          path: ${{ runner.temp }}/snakey-nes-smoke/build/SnakeySmoke.nes
          if-no-files-found: error
          retention-days: 7
      - name: Check CLI and boot plans
        run: |
          python3 tools/snakey.py targets
          python3 tools/snakey.py doctor
          python3 tools/snakey.py boot-plan --target game-boy
          python3 tools/snakey.py boot-plan --target nes
          python3 tools/snakey.py boot-plan --target nintendo-ds
