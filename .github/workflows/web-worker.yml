name: Snakey web and Worker CI

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "worker/**"
      - "tests/worker.test.js"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/web-worker.yml"
  pull_request:
    paths:
      - "site/**"
      - "worker/**"
      - "tests/worker.test.js"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/web-worker.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx wrangler deploy --dry-run
      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare deployment skipped; configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 0
          fi
          CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" npx wrangler deploy