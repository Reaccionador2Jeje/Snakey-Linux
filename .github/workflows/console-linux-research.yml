name: PSP, Vita and PS3 Linux research builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Console Linux research lane
        required: true
        type: choice
        options: [psp, vita, ps3]
  push:
    paths:
      - ".github/workflows/console-linux-research.yml"
      - "platforms/linux-port-sources.json"
      - "platforms/linux-targets.json"
      - "tools/audit_psp_archives.py"
      - "tools/fetch_psp_archives.py"
      - "tools/audit_ps3_rootfs.py"
      - "tools/validate_ps3_xfce4_manifest.py"
      - "docs/ps3-linux-bringup.md"
      - "linux/rootfs/**"
  pull_request:
    paths:
      - ".github/workflows/console-linux-research.yml"
      - "platforms/linux-port-sources.json"
      - "platforms/linux-targets.json"
      - "tools/audit_psp_archives.py"
      - "tools/fetch_psp_archives.py"
      - "docs/ps3-linux-bringup.md"
      - "linux/rootfs/**"

permissions:
  contents: read

concurrency:
  group: console-linux-research-${{ github.ref }}
  cancel-in-progress: false

env:
  VITA_UPSTREAM: acgh213/vita-linux-next
  VITA_REVISION: 05ee2d57b1d5a6f7b477141c3c68f65a069d682c
  BOOTLIN_DIR: armv7-eabihf--glibc--bleeding-edge-2025.08-1

jobs:
  psp-archive-audit:
    name: PSP uClinux 0.22 archival source audit (MIPS)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'psp'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata
        run: |
          python3 tools/validate_linux_targets.py
          python3 tools/validate_linux_sources.py
      - name: Fetch declared historical archives
        run: python3 tools/fetch_psp_archives.py artifacts/psp-archives
      - name: Verify archive integrity and record SHA-256
        run: python3 tools/audit_psp_archives.py artifacts/psp-archives
      - name: Upload PSP archive audit
        uses: actions/upload-artifact@v4
        with:
          name: snakey-psp-uclinux-022-source-audit
          path: artifacts/psp-archives/psp-archive-audit.json
          if-no-files-found: error
          retention-days: 30

  vita-rootfs:
    name: Vita Buildroot initramfs (ARMv7)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'vita'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.VITA_UPSTREAM }}
          ref: ${{ env.VITA_REVISION }}
          path: upstream-vita
          submodules: recursive
          fetch-depth: 1
      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bc binutils build-essential bzip2 cpio file flex g++ gcc git libelf-dev libncurses-dev libssl-dev make patch perl python3 rsync sed tar unzip wget
      - name: Build pinned Vita initramfs
        working-directory: upstream-vita
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VITA_REVISION"
          test -f buildroot/Makefile
          make rootfs LINUX_VITA_DIR=./linux_vita
          test -s linux_vita/rootfs.cpio.zst
          {
            printf 'upstream=%s\nrevision=%s\n' "$VITA_UPSTREAM" "$VITA_REVISION"
            printf 'buildroot_revision=%s\n' "$(git -C buildroot rev-parse HEAD)"
            printf 'rootfs_sha256='
            sha256sum linux_vita/rootfs.cpio.zst | cut -d ' ' -f 1
          } > rootfs-provenance.txt
      - name: Upload Vita initramfs
        uses: actions/upload-artifact@v4
        with:
          name: upstream-vita-rootfs-${{ env.VITA_REVISION }}
          path: |
            upstream-vita/linux_vita/rootfs.cpio.zst
            upstream-vita/rootfs-provenance.txt
          if-no-files-found: error
          retention-days: 14

  vita-upstream-kernel:
    name: Vita kernel with embedded initramfs (ARMv7)
    needs: vita-rootfs
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'vita'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.VITA_UPSTREAM }}
          ref: ${{ env.VITA_REVISION }}
          path: upstream-vita
          submodules: recursive
          fetch-depth: 1
      - name: Restore Buildroot initramfs
        uses: actions/download-artifact@v4
        with:
          name: upstream-vita-rootfs-${{ env.VITA_REVISION }}
          path: upstream-vita
      - name: Verify source and initramfs provenance
        working-directory: upstream-vita
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VITA_REVISION"
          test -s linux_vita/rootfs.cpio.zst
          git submodule status --recursive
          {
            printf 'upstream=%s\nrevision=%s\n' "$VITA_UPSTREAM" "$(git rev-parse HEAD)"
            git submodule status --recursive
            cat rootfs-provenance.txt
          } > ../vita-build-provenance.txt
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bc bison build-essential flex libelf-dev libssl-dev make python3
      - name: Cache Bootlin ARMv7 toolchain
        uses: actions/cache@v4
        id: toolchain
        with:
          path: .toolchains/${{ env.BOOTLIN_DIR }}
          key: bootlin-${{ env.BOOTLIN_DIR }}
      - name: Download Bootlin ARMv7 toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .toolchains
          curl --fail --location --retry 3 "https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/${BOOTLIN_DIR}.tar.xz" -o /tmp/bootlin.tar.xz
          tar -xJf /tmp/bootlin.tar.xz -C .toolchains
      - name: Validate Snakey metadata and Python tools
        run: |
          python3 tools/validate_linux_targets.py
          python3 tools/validate_linux_sources.py
          python3 -m py_compile tools/audit_psp_archives.py tools/fetch_psp_archives.py
      - name: Run upstream build-contract tests
        working-directory: upstream-vita
        run: |
          export PATH="${GITHUB_WORKSPACE}/.toolchains/${BOOTLIN_DIR}/bin:$PATH"
          make test CART_CROSS_CC=arm-linux-gcc
      - name: Configure kernel with initramfs
        working-directory: upstream-vita
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/.toolchains/${BOOTLIN_DIR}/bin:$PATH"
          make config CROSS_COMPILE=arm-linux-
          grep -F 'CONFIG_INITRAMFS_SOURCE="rootfs.cpio.zst"' linux_vita/.config
      - name: Build, verify and stage Vita kernel
        working-directory: upstream-vita
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/.toolchains/${BOOTLIN_DIR}/bin:$PATH"
          make stage CROSS_COMPILE=arm-linux-
          make verify-dtb CROSS_COMPILE=arm-linux-
          cp ../vita-build-provenance.txt dist/ci/
          (cd dist/ci && sha256sum * > SHA256SUMS)
      - name: Upload Vita kernel, DTBs and provenance
        uses: actions/upload-artifact@v4
        with:
          name: upstream-vita-linux-${{ env.VITA_REVISION }}
          path: upstream-vita/dist/ci/
          if-no-files-found: error
          retention-days: 14

  ps3-mainline-kernel:
    name: PS3 mainline Linux kernel build (PowerPC64 big-endian)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'ps3'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PS3_KERNEL_REVISION: adc218676eef25575469234709c2d87185ca223a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate pinned source provenance
        run: |
          python3 tools/validate_linux_targets.py
          python3 tools/validate_linux_sources.py
          grep -F 'CONFIG_PPC_PS3=y' <(curl --fail --location --retry 3 "https://raw.githubusercontent.com/torvalds/linux/${PS3_KERNEL_REVISION}/arch/powerpc/configs/ps3_defconfig")
      - name: Test Slackware rootfs assembly contract (including PS3)
        run: python3 linux/rootfs/test_rootfs_builder.py
      - name: Test PS3 PPC64 ELF rootfs audit
        run: python3 -m unittest discover -s tests -p 'test_ps3_rootfs_audit.py' -v
      - name: Compile PS3 rootfs audit tool
        run: python3 -m py_compile tools/audit_ps3_rootfs.py
      - name: Verify PS3 package manifest is present and unique
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names=[line.split("#",1)[0].strip() for line in Path("linux/rootfs/ps3.packages").read_text().splitlines()]
          names=[name for name in names if name]
          assert names and len(names)==len(set(names)), "invalid PS3 package manifest"
          print(f"PS3 PPC64 bootstrap package contract: OK ({len(names)} packages; ABI audit still required)")
          PY
      - name: Validate PS3 XFCE4 candidate package manifest
        run: python3 tools/validate_ps3_xfce4_manifest.py
      - name: Install PowerPC64 cross-build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bc bison build-essential flex gcc-powerpc64-linux-gnu libelf-dev libssl-dev make
      - name: Fetch exact upstream kernel revision
        run: |
          git init linux-ps3-kernel
          git -C linux-ps3-kernel remote add origin https://github.com/torvalds/linux.git
          git -C linux-ps3-kernel fetch --depth 1 origin "${PS3_KERNEL_REVISION}"
          git -C linux-ps3-kernel checkout --detach FETCH_HEAD
          test "$(git -C linux-ps3-kernel rev-parse HEAD)" = "$PS3_KERNEL_REVISION"
      - name: Configure PS3 kernel
        working-directory: linux-ps3-kernel
        run: |
          make ARCH=powerpc CROSS_COMPILE=powerpc64-linux-gnu- ps3_defconfig
          grep -Fx 'CONFIG_PPC_PS3=y' .config
          grep -Fx 'CONFIG_FB_PS3=y' .config
          grep -Fx 'CONFIG_GELIC_NET=y' .config
      - name: Build PowerPC64 big-endian kernel
        working-directory: linux-ps3-kernel
        run: |
          make -j2 ARCH=powerpc CROSS_COMPILE=powerpc64-linux-gnu- vmlinux
          powerpc64-linux-gnu-readelf -h vmlinux | tee elf-header.txt
          grep -E 'Data:.*big endian' elf-header.txt
          grep -F 'PowerPC64' elf-header.txt
      - name: Record build provenance and checksums
        working-directory: linux-ps3-kernel
        run: |
          mkdir -p ../ps3-kernel-artifact
          cp vmlinux .config System.map elf-header.txt ../ps3-kernel-artifact/
          {
            printf 'upstream=https://github.com/torvalds/linux.git\n'
            printf 'revision=%s\n' "$(git rev-parse HEAD)"
            printf 'config=arch/powerpc/configs/ps3_defconfig\n'
            printf 'artifact=vmlinux (ELF kernel; not a console boot image)\n'
          } > ../ps3-kernel-artifact/provenance.txt
          cd ../ps3-kernel-artifact
          sha256sum vmlinux .config System.map elf-header.txt provenance.txt > SHA256SUMS
      - name: Upload PS3 kernel build artifact
        uses: actions/upload-artifact@v4
        with:
          name: snakey-ps3-mainline-kernel-v6.12
          path: ps3-kernel-artifact/
          if-no-files-found: error
          retention-days: 14
